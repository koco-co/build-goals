name: Validate Plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check patch whitespace
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            base="$(git merge-base HEAD origin/main)"
            git diff --check "$base"..HEAD
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Check shared runtime mirrors
        run: >-
          python3 skills/build-plugin/scripts/sync_shared_files.py
          --root .

      - name: Validate plugin across platforms
        run: |
          python3 skills/build-plugin/scripts/validate_plugin.py \
            . \
            --platform all \
            --strict

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
