name: Validate Plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check shared runtime mirrors
        run: >-
          python3 skills/build-plugin/scripts/sync_shared_files.py
          --root .

      - name: Validate dual-platform plugin
        run: |
          python3 skills/build-plugin/scripts/validate_plugin.py \
            . \
            --platform dual \
            --strict

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
