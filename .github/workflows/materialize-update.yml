name: Materialize Reviewed Update

on:
  push:
    branches: [main]
    paths:
      - '.github/materialize/**'
      - '.github/workflows/materialize-update.yml'
      - 'scripts/materialize_update.py'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize reviewed files
        run: python3 scripts/materialize_update.py

      - name: Validate dual-platform plugin
        run: |
          python3 skills/building-plugins/scripts/validate_plugin.py \
            . \
            --platform dual \
            --strict

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit materialized source files
        run: |
          # GITHUB_TOKEN cannot update workflow files. Keep the current workflows
          # unchanged here; they are updated and cleaned up in a separate trusted commit.
          git checkout HEAD -- .github/workflows/validate-skills.yml
          rm -rf .github/materialize
          rm -f scripts/materialize_update.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add cross-platform plugin builder"
          git push origin HEAD:main
